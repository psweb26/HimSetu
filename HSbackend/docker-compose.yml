name: himsetu

services:
  db:
    image: postgres:16-alpine
    container_name: himachal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: himachal_accountability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Phnopranshu_25
    ports:
      - "5432:5432"
    volumes:
      - himachal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d himachal_accountability"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - himachal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: himachal_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:Phnopranshu_25@db:5432/himachal_accountability
      MUNICIPAL_REGION: HIMACHAL_PRADESH
      MONSOON_COMMAND_STATE: ACTIVE
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
    networks:
      - himachal_network

  frontend:
    build:
      context: ../HSfrontend
      dockerfile: Dockerfile.frontend
    container_name: himachal_frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../HSfrontend:/app
      - /app/node_modules
    networks:
      - himachal_network

  admin:
    build:
      context: ../HSadmin
      dockerfile: Dockerfile
    container_name: himachal_admin
    restart: unless-stopped
    env_file:
      - ../HSadmin/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../HSadmin:/app
      - /app/node_modules
    networks:
      - himachal_network

networks:
  himachal_network:
    driver: bridge

volumes:
  himachal_postgres_data:
